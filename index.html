<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div class="header-row">
          <h1>待辦清單</h1>
          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-label="切換深色模式"
          >
            <span class="theme-icon" aria-hidden="true">🌙</span>
            <span class="theme-label">深色模式</span>
          </button>
        </div>
      </header>

      <form id="todo-form" class="todo-form" novalidate>
        <input
          id="todo-input"
          type="text"
          maxlength="80"
          placeholder="新增待辦事項"
          aria-label="新增待辦事項"
        />
        <button type="submit">新增</button>
      </form>

      <div class="filter-group" role="group" aria-label="待辦篩選">
        <button class="filter-btn active" type="button" data-filter="all" aria-pressed="true">
          全部
        </button>
        <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">
          未完成
        </button>
        <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">
          已完成
        </button>
      </div>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

      <p id="empty-state" class="empty-state" hidden>
        還沒有任何待辦事項,新增一個吧!
      </p>

      <footer class="todo-footer">
        <span id="todo-count">未完成: 0 項</span>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
